name: Publish Cookie Remover

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - background.js
      - scheduler.js
      - settings.js
      - popup.*
      - cookie-remover.zip
      - cookie-cleaner-10min.zip
      - scripts/package.py
      - test/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cookie-remover-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extension files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test settings and scheduling
        run: npm test

      - name: Verify finished ZIPs
        run: python3 scripts/package.py --check

      - name: Read extension version
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path("manifest.json").read_text())["version"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,3}", version):
              raise SystemExit("Invalid extension version.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"tag=v{version}\n")
          PY

      - name: Publish version and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            python3 scripts/package.py --check --verify-tag "$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Cookie Remover $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" cookie-remover.zip --clobber
